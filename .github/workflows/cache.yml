name: Refresh cache

on:
  schedule:
    - cron: "23 * * * *"          # hourly
    - cron: "*/20 15-17 * * 0"    # every 20 min on Sunday late morning ET, when inactives move lines
  workflow_dispatch:

concurrency: cache-refresh

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The current slate supplies opening lines and pre-game lines for games in progress.
      - name: Read previous slate
        run: |
          mkdir -p .cache
          npx wrangler kv key get slate --namespace-id "${{ vars.KV_NAMESPACE_ID }}" --remote > .cache/prev.json || rm -f .cache/prev.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Build cache entries
        run: |
          PREV=""
          if [ -s .cache/prev.json ]; then PREV="--prev .cache/prev.json"; fi
          npx tsx scripts/build-cache.ts --out .cache/bulk.json $PREV
      - name: Write to Workers KV
        run: npx wrangler kv bulk put .cache/bulk.json --namespace-id "${{ vars.KV_NAMESPACE_ID }}" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
